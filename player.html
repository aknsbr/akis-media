<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKIŞ Media Oynatıcı</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:transparent;
  font-family:Arial, sans-serif;
  color:#F1E8D6;
}

.player{
  max-width:900px;
  margin:auto;
  background:#080F13;
  border:1px solid #D89532;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.top{
  padding:18px 20px 14px;
  background:linear-gradient(
    180deg,
    #0D1A24,
    #080F13
  );
  border-bottom:1px solid rgba(216,149,50,.35);
}

.brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:4px;
}

.mode{
  color:#D89532;
  font-size:11px;
  letter-spacing:2px;
}

.player-name{
  margin-top:16px;
}

.player-title{
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.player-subtitle{
  margin-top:5px;
  color:#D89532;
  font-size:11px;
  letter-spacing:2px;
}

.progress-wrap{
  margin-top:16px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  color:#C8C0B1;
  font-size:11px;
  margin-bottom:5px;
}

input[type="range"]{
  width:100%;
  accent-color:#D89532;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:14px 20px;
}

button{
  height:42px;
  min-width:44px;

  border:1px solid rgba(216,149,50,.55);
  border-radius:10px;

  background:#111A20;
  color:#F1E8D6;

  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#17242D;
  border-color:#D89532;
}

.play{
  width:54px;
  height:54px;

  border-radius:50%;
  border:none;

  background:#F1E8D6;
  color:#080F13;

  font-size:19px;
}

.active-mode{
  background:#D89532;
  color:#080F13;
  border-color:#D89532;
}

.volume-box{
  display:flex;
  align-items:center;
  gap:8px;

  min-width:160px;
}

.volume-box input{
  width:110px;
}

.playlist{
  border-top:1px solid rgba(216,149,50,.25);
}

.track{
  display:grid;
  grid-template-columns:42px 1fr auto;
  align-items:center;

  gap:12px;
  padding:13px 18px;

  border-bottom:1px solid rgba(255,255,255,.05);

  cursor:pointer;
}

.track:hover{
  background:#0D171E;
}

.track.active{
  background:#13212A;
  border-left:3px solid #D89532;
}

.number{
  color:#D89532;
  font-size:12px;
}

.track-name{
  font-size:14px;
  font-weight:600;
}

.track-state{
  color:#D89532;
  font-size:11px;
  letter-spacing:1px;
}

.loading,
.error{
  padding:18px;
  text-align:center;
  color:#C8C0B1;
  font-size:13px;
}

.footer{
  padding:10px 18px 14px;

  color:#817A70;
  font-size:10px;
  letter-spacing:1px;

  text-align:right;
}

@media(max-width:600px){

  .player-title{
    font-size:18px;
  }

  .controls{
    gap:6px;
  }

  .track{
    grid-template-columns:30px 1fr auto;
  }

}

</style>
</head>

<body>

<div class="player">

  <div class="top">

    <div class="brand">

      <div class="logo">
        AKIŞ
      </div>

      <div id="modeText" class="mode">
        SIRALI OYNATMA
      </div>

    </div>


    <div class="player-name">

      <div class="player-title">
        AKIŞ MEDIA OYNATICI
      </div>

      <div class="player-subtitle">
        MÜZİK ARŞİVİ
      </div>

    </div>


    <div class="progress-wrap">

      <div class="time-row">

        <span id="currentTime">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

    </div>

  </div>


  <div class="controls">

    <button
      id="shuffle"
      title="Karışık oynat"
    >
      🔀
    </button>

    <button
      id="prev"
      title="Önceki şarkı"
    >
      ⏮
    </button>

    <button
      id="play"
      class="play"
      title="Oynat / Duraklat"
    >
      ▶
    </button>

    <button
      id="next"
      title="Sonraki şarkı"
    >
      ⏭
    </button>

    <button
      id="repeat"
      title="Döngü modu"
    >
      🔁
    </button>


    <div class="volume-box">

      <span>
        🔊
      </span>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.9"
      >

    </div>

  </div>


  <div id="playlist" class="playlist">

    <div class="loading">
      MP3 dosyaları yükleniyor...
    </div>

  </div>


  <div class="footer">
    AKIŞ • MUSIC PLAYER
  </div>

</div>


<audio
  id="audio"
  preload="metadata"
></audio>


<script>

const repoOwner = "aknsbr";
const repoName = "akis-media";

let songs = [];

let currentIndex = 0;

let shuffle = false;

let repeatMode = 0;


/*
repeatMode

0 = normal
1 = tüm liste döngü
2 = tek şarkı döngü
*/


const audio =
  document.getElementById("audio");

const playBtn =
  document.getElementById("play");

const prevBtn =
  document.getElementById("prev");

const nextBtn =
  document.getElementById("next");

const shuffleBtn =
  document.getElementById("shuffle");

const repeatBtn =
  document.getElementById("repeat");

const progress =
  document.getElementById("progress");

const volume =
  document.getElementById("volume");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const playlist =
  document.getElementById("playlist");

const modeText =
  document.getElementById("modeText");



function formatTime(seconds){

  if(!isFinite(seconds)){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return minutes + ":" + secs;
}



function cleanTitle(filename){

  return filename

    .replace(/\.mp3$/i,"")

    .replace(/_/g," ")

    .trim();

}



async function loadSongsFromGitHub(){

  try{

    const response =
      await fetch(
        `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`
      );


    if(!response.ok){

      throw new Error(
        "GitHub deposuna erişilemedi."
      );

    }


    const files =
      await response.json();


    songs = files

      .filter(file =>

        file.type === "file" &&

        file.name
          .toLowerCase()
          .endsWith(".mp3")

      )

      .map(file => ({

        title:
          cleanTitle(file.name),

        src:
          file.download_url

      }))

      .sort((a,b) =>

        a.title.localeCompare(
          b.title,
          "tr"
        )

      );


    if(songs.length === 0){

      playlist.innerHTML =
        `
        <div class="error">
          MP3 dosyası bulunamadı.
        </div>
        `;

      return;

    }


    loadSong(
      0,
      false
    );


  }catch(error){

    console.error(error);


    playlist.innerHTML =
      `
      <div class="error">
        Şarkılar yüklenemedi.
      </div>
      `;

  }

}



function renderPlaylist(){

  playlist.innerHTML = "";


  songs.forEach(
    (song,index) => {

      const row =
        document.createElement("div");


      row.className =

        "track" +

        (
          index === currentIndex
          ? " active"
          : ""
        );


      row.innerHTML =
        `

        <div class="number">

          ${String(index + 1)
            .padStart(2,"0")}

        </div>


        <div class="track-name">

          ${song.title}

        </div>


        <div class="track-state">

          ${
            index === currentIndex
            ? "SEÇİLİ"
            : ""
          }

        </div>

        `;


      row.onclick = () => {

        loadSong(
          index,
          true
        );

      };


      playlist.appendChild(row);

    }
  );

}



function loadSong(
  index,
  autoplay = false
){

  if(!songs.length){
    return;
  }


  currentIndex = index;


  audio.src =
    songs[index].src;


  audio.load();


  progress.value = 0;


  currentTime.textContent =
    "0:00";


  duration.textContent =
    "0:00";


  renderPlaylist();


  if(autoplay){

    audio
      .play()
      .catch(error => {

        console.log(
          "Oynatma engellendi:",
          error
        );

      });

  }

}



function randomSong(){

  if(songs.length <= 1){

    return currentIndex;

  }


  let next =
    currentIndex;


  while(
    next === currentIndex
  ){

    next =
      Math.floor(
        Math.random() *
        songs.length
      );

  }


  return next;

}



function nextSong(){

  if(!songs.length){
    return;
  }


  if(shuffle){

    loadSong(
      randomSong(),
      true
    );

    return;

  }


  if(
    currentIndex <
    songs.length - 1
  ){

    loadSong(
      currentIndex + 1,
      true
    );

    return;

  }


  if(repeatMode === 1){

    loadSong(
      0,
      true
    );

  }

}



function prevSong(){

  if(!songs.length){
    return;
  }


  if(
    audio.currentTime > 3
  ){

    audio.currentTime = 0;

    return;

  }


  if(shuffle){

    loadSong(
      randomSong(),
      true
    );

    return;

  }


  if(currentIndex > 0){

    loadSong(
      currentIndex - 1,
      true
    );

    return;

  }


  if(repeatMode === 1){

    loadSong(
      songs.length - 1,
      true
    );

  }

}



playBtn.onclick =
async () => {

  if(!songs.length){
    return;
  }


  if(audio.paused){

    try{

      await audio.play();

    }catch(error){

      console.log(error);

    }

  }else{

    audio.pause();

  }

};



prevBtn.onclick =
  prevSong;


nextBtn.onclick =
  nextSong;



shuffleBtn.onclick =
() => {

  shuffle =
    !shuffle;


  shuffleBtn
    .classList
    .toggle(
      "active-mode",
      shuffle
    );


  updateModeText();

};



repeatBtn.onclick =
() => {

  repeatMode++;


  if(
    repeatMode > 2
  ){

    repeatMode = 0;

  }


  repeatBtn
    .classList
    .toggle(
      "active-mode",
      repeatMode > 0
    );


  if(
    repeatMode === 2
  ){

    repeatBtn.textContent =
      "🔂";

  }else{

    repeatBtn.textContent =
      "🔁";

  }


  updateModeText();

};



function updateModeText(){

  if(
    repeatMode === 2
  ){

    modeText.textContent =
      "TEK ŞARKI DÖNGÜ";

    return;

  }


  if(
    shuffle &&
    repeatMode === 1
  ){

    modeText.textContent =
      "KARIŞIK • TÜMÜ DÖNGÜ";

    return;

  }


  if(shuffle){

    modeText.textContent =
      "KARIŞIK OYNATMA";

    return;

  }


  if(
    repeatMode === 1
  ){

    modeText.textContent =
      "TÜM LİSTE DÖNGÜ";

    return;

  }


  modeText.textContent =
    "SIRALI OYNATMA";

}



volume.oninput =
() => {

  audio.volume =
    volume.value;

};



progress.oninput =
() => {

  if(audio.duration){

    audio.currentTime =

      (
        progress.value /
        100
      )

      *

      audio.duration;

  }

};



audio.onplay =
() => {

  playBtn.textContent =
    "❚❚";

};



audio.onpause =
() => {

  playBtn.textContent =
    "▶";

};



audio.onloadedmetadata =
() => {

  duration.textContent =
    formatTime(
      audio.duration
    );

};



audio.ontimeupdate =
() => {

  currentTime.textContent =
    formatTime(
      audio.currentTime
    );


  if(audio.duration){

    progress.value =

      (
        audio.currentTime /
        audio.duration
      )

      *

      100;

  }

};



audio.onended =
() => {


  if(
    repeatMode === 2
  ){

    audio.currentTime = 0;

    audio.play();

    return;

  }


  if(shuffle){

    loadSong(
      randomSong(),
      true
    );

    return;

  }


  if(
    currentIndex <
    songs.length - 1
  ){

    loadSong(
      currentIndex + 1,
      true
    );

    return;

  }


  if(
    repeatMode === 1
  ){

    loadSong(
      0,
      true
    );

    return;

  }


  playBtn.textContent =
    "▶";

};



audio.volume = 0.9;


loadSongsFromGitHub();

</script>

</body>
</html>
