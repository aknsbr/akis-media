<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:8px;
  background:transparent;
  font-family:Arial,sans-serif;
}

.player{
  width:100%;
  background:#080F13;
  border:1px solid #C99745;
  border-radius:16px;
  padding:18px 20px;
}

.title{
  color:#F2E7D0;
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:4px;
}

.artist{
  color:#C99745;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:14px;
}

audio{
  display:block;
  width:100%;
  height:42px;
}
</style>
</head>

<body>

<div class="player">

  <div class="title">
    BİZE ŞEYTAN DEDİLER
  </div>

  <div class="artist">
    AKIŞ • 2026
  </div>

  <audio controls preload="metadata">
    <source
      src="B%C4%B0ZE%20%C5%9EEYTAN%20DED%C4%B0LER.mp3"
      type="audio/mpeg">
    Tarayıcınız ses oynatmayı desteklemiyor.
  </audio>

</div>

</body>
</html>
